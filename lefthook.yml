# Lefthook — git hooks (https://lefthook.dev)
# Installed automatically by `pnpm install` (the `prepare` script).
# Skip once with: LEFTHOOK=0 git commit ...   (use sparingly)

pre-commit:
  parallel: false # lint --fix first, then format, so they don't race on the same file
  jobs:
    - name: oxlint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: pnpm exec oxlint --fix --deny-warnings {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,yml,yaml}"
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: |
        msg=$(head -n1 "{1}")
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$'
        if ! echo "$msg" | grep -qE "$pattern" && ! echo "$msg" | grep -qE '^(Merge|Revert|fixup!|squash!) '; then
          echo "✖ Commit message must follow Conventional Commits:"
          echo "    <type>(<scope>)?: <subject>"
          echo "  types: feat fix docs style refactor perf test build ci chore revert"
          echo "  e.g.   feat(web): add notebook list page"
          echo "  got:   $msg"
          exit 1
        fi

pre-push:
  jobs:
    - name: check-types
      run: pnpm check-types
